services:
  whoogle:
    image: benbusby/whoogle-search:latest
    container_name: whoogle
    restart: unless-stopped
    pids_limit: 50
    mem_limit: 256mb
    memswap_limit: 256mb
    user: whoogle
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5000:5000"
    environment:
      - WHOOGLE_AUTOCOMPLETE=1
      - WHOOGLE_CONFIG_THEME=system
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
