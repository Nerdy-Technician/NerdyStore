services:
  transmission:
    image: ghcr.io/linuxserver/transmission
    container_name: transmission
    restart: always
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./watch:/watch
    environment:
      - PUID=1026
      - PGID=100
      - USER=${TRANSMISSION_USER:-admin}
      - PASS=${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
