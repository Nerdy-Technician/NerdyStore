<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NerdyStore</title>
<script>
  // GitHub Pages SPA fallback: hand unknown paths to the app, which shows its own Not Found view.
  var l = window.location;
  l.replace('/?path=' + encodeURIComponent(l.pathname + l.search + l.hash));
</script>
</head>
</html>
