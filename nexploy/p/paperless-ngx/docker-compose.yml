# Copy .env.example to .env and replace the placeholders before starting.
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
    container_name: paperless
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DBPASS:?Set PAPERLESS_DBPASS in .env}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_OCR_LANGUAGE=eng
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:18
    container_name: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DBPASS:?Set PAPERLESS_DBPASS in .env}
    volumes:
      # Postgres 18 images store data in /var/lib/postgresql, not .../data.
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
