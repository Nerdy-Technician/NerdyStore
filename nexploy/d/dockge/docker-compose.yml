services:
  dockge:
    image: louislam/dockge:1.5.0
    container_name: Dockge
    restart: always
    ports:
      - "5571:5001"
    volumes:
      # Required to manage stacks. Equivalent to root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stacks:/stacks
      - ./data:/app/data
    environment:
      - DOCKGE_STACKS_DIR=/stacks
