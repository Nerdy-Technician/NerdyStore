services:
  portainer_agent:
    image: portainer/agent:2.45.3
    container_name: portainer_agent
    restart: always
    ports:
      # The agent API does not authenticate clients. Do not publish 9001 on a public interface.
      - "9001:9001"
    volumes:
      # Required for the agent. Equivalent to root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
