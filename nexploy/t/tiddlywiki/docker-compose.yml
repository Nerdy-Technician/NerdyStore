# Copy .env.example to .env and replace the password before starting.
services:
  tiddlywiki:
    image: jbardi/tiddlywiki5-lazy-images:v5.3.6
    container_name: tiddlywiki
    restart: always
    ports:
      - "5645:8080"
    volumes:
      - ./data:/var/lib/tiddlywiki
    environment:
      - USERNAME=${TIDDLYWIKI_USERNAME:-admin}
      - PASSWORD=${TIDDLYWIKI_PASSWORD:?Set TIDDLYWIKI_PASSWORD in .env}
