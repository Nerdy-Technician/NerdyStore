services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "80:80"
    # Change the image's default first-run login immediately.
    volumes:
      - ./root:/srv
      # Directories, not files. Docker creates a directory if a bind source is missing,
      # which breaks a file mount such as database.db or settings.json.
      - ./database:/database
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
