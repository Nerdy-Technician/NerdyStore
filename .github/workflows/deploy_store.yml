name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build apps index
        run: node scripts/build_store.js

      - name: Populate gui/public from nexploy dist
        run: |
          rm -f gui/public/NPINDEX gui/public/categories.json gui/public/nexterm.json || true
          rm -rf gui/public/categories || true
          cp nexploy/dist/NPINDEX gui/public/NPINDEX
          cp nexploy/dist/categories.json gui/public/categories.json
          cp nexploy/dist/nexterm.json gui/public/nexterm.json
          cp -r nexploy/dist/categories gui/public/categories
          VERSION=$(grep '^VERSION=' .github/VERSION | cut -d'=' -f2)
          RELEASE_DATE=$(grep '^RELEASE_DATE=' .github/VERSION | cut -d'=' -f2)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' .github/VERSION | cut -d'=' -f2)
          printf '{"version":"%s","releaseDate":"%s","buildNumber":"%s"}\n' "$VERSION" "$RELEASE_DATE" "$BUILD_NUMBER" > gui/public/version.json
          mkdir -p gui/public/logos
          find gui/public/logos -type l -delete 2>/dev/null || true

      - name: Install gui dependencies
        run: |
          cd gui
          npm install

      - name: Build gui
        run: |
          cd gui
          npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy/logos deploy/nexterm/scripts deploy/nexterm/snippets deploy/nexterm/themes
          touch deploy/.nojekyll
          cp -r gui/dist/* deploy/
          cp -r nexploy/dist/* deploy/
          [ -d gui/public/logos ] && cp gui/public/logos/*.png deploy/logos/ 2>/dev/null || true
          cp -r nexterm/scripts/. deploy/nexterm/scripts/
          cp -r nexterm/snippets/. deploy/nexterm/snippets/
          cp -r nexterm/themes/. deploy/nexterm/themes/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deploy
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
