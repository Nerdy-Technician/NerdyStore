name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build apps index
        run: node scripts/build_store.js

      - name: Populate gui/public from nexploy dist
        run: |
          rm -f gui/public/NPINDEX gui/public/categories.json gui/public/nexterm.json || true
          rm -rf gui/public/categories || true
          cp nexploy/dist/NPINDEX gui/public/NPINDEX
          cp nexploy/dist/categories.json gui/public/categories.json
          cp nexploy/dist/nexterm.json gui/public/nexterm.json
          cp -r nexploy/dist/categories gui/public/categories
          mkdir -p gui/public/logos
          find gui/public/logos -type l -delete 2>/dev/null || true

      - name: Install gui dependencies
        run: |
          cd gui
          npm install

      - name: Build gui
        run: |
          cd gui
          npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy/logos
          touch deploy/.nojekyll
          cp -r gui/dist/* deploy/
          cp -r nexploy/dist/* deploy/
          [ -d gui/public/logos ] && cp gui/public/logos/*.png deploy/logos/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
