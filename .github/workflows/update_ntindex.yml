name: Generate NTINDEX

on:
  push:
    branches: [main]
    paths: ['nexterm/scripts/**', 'nexterm/snippets/**', 'nexterm/themes/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate NTINDEX
        run: |
          cd nexterm
          echo "# Scripts" > NTINDEX
          find scripts -type f -name "*.sh" | sort | while read file; do
            hash=$(md5sum "$file" | cut -d' ' -f1)
            echo "${file}@${hash}" >> NTINDEX
          done
          echo "" >> NTINDEX
          echo "# Snippets" >> NTINDEX
          find snippets -type f -name "*.snippet" | sort | while read file; do
            hash=$(md5sum "$file" | cut -d' ' -f1)
            echo "${file}@${hash}" >> NTINDEX
          done
          echo "" >> NTINDEX
          echo "# Themes" >> NTINDEX
          find themes -type f -name "*.theme.css" | sort | while read file; do
            hash=$(md5sum "$file" | cut -d' ' -f1)
            echo "${file}@${hash}" >> NTINDEX
          done

      - name: Commit NTINDEX
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nexterm/NTINDEX
          git diff --staged --quiet || git commit -m "chore: update NTINDEX"
          git push
