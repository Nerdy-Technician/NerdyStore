# Copy .env.example to .env and replace APP_KEY before starting.
services:
  speedtest-tracker:
    image: ghcr.io/alexjustesen/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - APP_KEY=${APP_KEY:?Set APP_KEY in .env}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
